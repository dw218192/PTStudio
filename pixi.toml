[workspace]
name = "ptstudio"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

# Pixi owns the Python environment and all project task entry points.

[dependencies]
python = "3.12.*"
# The Conan profiles select the Ninja generator. Previously this was whatever
# happened to be on the system PATH; pin it here so the toolchain is part of
# the declared environment.
ninja = ">=1.11"

[pypi-dependencies]
# Task command-line interfaces and configuration
click = ">=8.0"
pyyaml = ">=6.0"
colorama = ">=0.4"
# formatting / linting
clang-format = ">=19.0"
ruff = ">=0.4"
# build + asset tooling (versions pinned to match the previous managed venv)
conan = "==2.22.2"
cmake = "==3.31.1"
jinja2 = "==3.1.6"
InquirerPy = "==0.3.4"
# flip-evaluator's nbflip.pyd uses nanobind->numpy for evaluate()/load() but the
# wheel does not declare numpy/Pillow as runtime deps; without them it aborts.
flip-evaluator = "==1.7"
numpy = ">=2.0"
pillow = ">=10.0"
pytest = ">=7.0"

[tasks]
build = "python -m tasks.build"
test = "python -m tasks.test"
fmt = "python -m tasks.fmt"
lint = "python -m tasks.lint"
check = { depends-on = ["lint", "test-tasks", "test"] }
launch = "python -m tasks.launch"
package = "python -m tasks.package"
publish = "python -m tasks.publish"
image-diff = "python -m tasks.image_diff"
bake-gt = "python -m tasks.bake_gt"
slangc = "python -m tasks.slangc"
shader-variants-codegen = "python -m tasks.shader_variants_codegen"
embed = "python -m tasks.embed"
usdz = "python -m tasks.usdz"
clean = "python -m tasks.clean"
test-tasks = "python -m pytest tasks/tests"
