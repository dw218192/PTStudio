# Project-specific allowlist extensions.
# Merged with the framework default (allowlist_default.toml) at agent launch.

[[allow]]
name = "diagnostics"
commands = ["handle64", "handle"]

[[allow]]
name = "safe_git_rewrite"
override_deny = true
patterns = [
    'git\s+commit\s.*--amend',          # amend last commit (local only)
    'git\s+reset\s+--soft\b',           # soft reset (keeps working tree)
    'git\s+rebase\s+--(continue|abort|skip)', # rebase recovery
    'git\s+stash\b',                    # stash / stash pop
]
