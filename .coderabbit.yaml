# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: assertive
  poem: false
  auto_review:
    base_branches:
      - develop
    path_filters:
      - "!assets/**"
  path_instructions:
    - path: "**/*.{h,cpp}"
      instructions: |
        C++ naming conventions for this project:
        - Types: UpperCamelCase (e.g. RenderWorld, BufferReadback)
        - Functions/methods: snake_case (e.g. tick_until_settled, try_read_u32)
        - Variables: snake_case, private members use m_ prefix (e.g. m_buffer)
        - constexpr/const constants: k_snake_case (e.g. k_orbit_speed, k_max_pitch)
        - Namespaces: snake_case (e.g. pts::webgpu)
        - Macros: UPPER_SNAKE_CASE
        Do NOT suggest renaming k_snake_case constants to kCamelCase.

        File naming conventions:
        - Source/header files: lowerCamelCase (e.g. renderWorld.cpp, pipelineBuilder.h)
        - Directories: snake_case (e.g. rendering, webgpu)
        - Test files: testLowerCamelCase (e.g. testMeshCache.cpp, testRenderWorldSlotMap.cpp)
        Flag any new .cpp or .h files that use snake_case naming (e.g. my_file.cpp should be myFile.cpp).
knowledge_base:
  code_guidelines:
    filePatterns:
      - '**/.cursor/rules/*'
      - 'CLAUDE.md'
  learnings:
    scope: auto
