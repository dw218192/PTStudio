# Agent command rules — controls which Bash commands the auto-approver
# will accept or reject.  Patterns are matched against the full command
# segment (executable + arguments), so use \b word boundaries instead
# of $ anchors.
#
# Evaluation order:
#
#   1. [[deny]]  rules checked first (first match wins → denied)
#   2. [[allow]] rules checked next  (must match at least one → approved)
#   3. No match → denied with default_reason
#
# Each rule has:
#   name     — human-readable label
#   patterns — regexes matched against each command segment (exe + args)
#   reason   — (optional) denial message shown when this rule triggers
#   dir      — (optional) "project_root" or "!project_root"

default_reason = "try another approach"

# ── Deny rules ───────────────────────────────────────────────────────

[[deny]]
name = "destructive"
patterns = ['^rm\b', '^rmdir\b', '^del\b']
dir = "!project_root"
reason = "destructive file operations are only allowed within the project tree"

[[deny]]
name = "admin"
patterns = ['^sudo\b', '^su\b', '^runas\b']
reason = "elevated privilege commands are not permitted"

# ── Allow rules ──────────────────────────────────────────────────────

[[allow]]
name = "file_inspection"
patterns = ['^cat\b', '^head\b', '^tail\b', '^less\b', '^wc\b', '^file\b', '^type\b']

[[allow]]
name = "navigation"
patterns = ['^cd\b', '^ls\b', '^dir\b', '^tree\b', '^find\b', '^fd\b']

[[allow]]
name = "search"
patterns = ['^grep\b', '^rg\b', '^findstr\b', '^ag\b']

[[allow]]
name = "shell"
patterns = ['^echo\b', '^printf\b', '^test\b', '^\[', '^true\b', '^false\b', '^expr\b', '^sleep\b']

[[allow]]
name = "text_processing"
patterns = ['^xargs\b', '^sort\b', '^uniq\b', '^cut\b', '^awk\b', '^sed\b', '^tr\b', '^tee\b']

[[allow]]
name = "system_info"
patterns = ['^which\b', '^where\b', '^env\b', '^printenv\b', '^pwd\b', '^whoami\b', '^date\b', '^uname\b']

[[allow]]
name = "version_control"
patterns = ['^git\b', '^gh\b']

[[allow]]
name = "build_tools"
patterns = ['^\./pts\b', '^python\b', '^cmake\b', '^conan\b', '^ninja\b', '^make\b']
dir = "project_root"
reason = "build tools must be run from within the project tree"

[[allow]]
name = "destructive_in_project"
patterns = ['^rm\b', '^rmdir\b', '^del\b']
dir = "project_root"

[[allow]]
name = "network"
patterns = ['^curl\b', '^wget\b']

[[allow]]
name = "control_flow"
patterns = ['^for\b', '^if\b', '^while\b', '^case\b', '^bash\b', '^sh\b']
