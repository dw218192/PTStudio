name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  # =============================================================================
  # Formatting Check
  # =============================================================================

  check-formatting:
    name: Check formatting
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.70.2
          cache: true

      - name: Check code formatting
        run: pixi run lint

  # =============================================================================
  # Build (platform x build_type matrix)
  # =============================================================================

  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, emscripten]
        build_type: [Release]
        include:
          - platform: windows-x64
            # Pinned, NOT windows-latest. windows-latest moved to the
            # windows-2025-vs2026 image, whose MSVC 14.51 cannot build the
            # pinned Dawn: Dawn's vendored SPIRV-Tools compiles with /WX, and
            # 14.51 raises a new C5232 (recursive operator== in C++20) in
            # util/small_vector.h that older MSVC did not.
            # windows-2022 also matches the VS 2022 developers build with, so
            # CI and local resolve to the same Conan package IDs.
            # Revisit when Dawn is upgraded to a SPIRV-Tools that is clean
            # under MSVC 14.51.
            os: windows-2022
            shell: pwsh
            lock_file: conan_glfw.lock
          - platform: emscripten
            os: ubuntu-latest
            shell: bash
            lock_file: conan_emscripten.lock

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.70.2
          cache: true

      # On Windows CI the workspace is on D: but ~/.conan2 defaults to C:.
      # Conan's full_deploy deployer fails computing relative paths across
      # drives. Put CONAN_HOME on the same drive as the workspace.
      - name: Set Conan home (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CONAN_HOME=D:/.conan2" >> $env:GITHUB_ENV

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && 'D:/.conan2' || '~/.conan2' }}
          key: ${{ matrix.platform }}-conan-${{ hashFiles('conanfile.py', matrix.lock_file) }}
          restore-keys: |
            ${{ matrix.platform }}-conan-${{ hashFiles('conanfile.py') }}

      # usdz_pack is a native host tool that can't cross-compile to WASM.
      # Emscripten CI builds it natively first (via its own Conan package,
      # isolated from the root project's Conan graph), then the main build
      # picks up the generated .usdz scenes from assets/scenes/.
      - name: Build host tools (native Linux)
        if: matrix.platform == 'emscripten'
        run: pixi run build --platform linux-x64 --build-type ${{ matrix.build_type }} --host-tools-only

      - name: Build project
        run: pixi run build --platform ${{ matrix.platform }} --build-type ${{ matrix.build_type }}
        env:
          PTSTUDIO_GPU_BACKEND: ${{ matrix.platform == 'windows-x64' && 'D3D12' || '' }}

      - name: Package build artifacts
        run: pixi run package --platform ${{ matrix.platform }} --build-type ${{ matrix.build_type }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.build_type }}
          path: _package/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 3

  # =============================================================================
  # Test (platform x build_type matrix)
  # =============================================================================

  test:
    name: Test (${{ matrix.platform }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, emscripten]
        build_type: [Release]
        include:
          - platform: windows-x64
            # Match the build job's runner -- see the note there.
            os: windows-2022
            shell: pwsh
          - platform: emscripten
            os: ubuntu-latest
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.70.2
          cache: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.build_type }}
          path: _package/${{ matrix.platform }}/

      - name: Run tests
        run: pixi run test --platform ${{ matrix.platform }} --build-type ${{ matrix.build_type }} --from-package
        env:
          PTSTUDIO_GPU_BACKEND: ${{ matrix.platform == 'windows-x64' && 'D3D12' || '' }}
          # The windows runners' D3D12 software adapter drops the device a few
          # seconds into the first Forward frame. Pre-existing and not specific
          # to this repo's current code -- `develop` reproduces it identically.
          # See the note in tools/repo_tools/launch.py. ptSmoke_* (path tracer)
          # still runs here and still covers the GPU pipeline end to end.
          PTSTUDIO_SKIP_EDITOR_SMOKE: ${{ matrix.platform == 'windows-x64' && '1' || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.build_type }}
          path: _logs/
          retention-days: 3

  # =============================================================================
  # Image diff (non-blocking, windows-x64 only)
  # =============================================================================

  image-diff:
    name: Image diff (windows-x64, Release)
    # Match the build job's runner -- see the note there.
    runs-on: windows-2022
    needs: build
    continue-on-error: true
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.70.2
          cache: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-windows-x64-Release
          path: _package/windows-x64/

      - name: Run image-diff
        run: pixi run image-diff --from-package --platform windows-x64 --build-type Release

      - name: Upload image-diff outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-diff-windows-x64-Release
          path: _test_captures/
          retention-days: 7

  # =============================================================================
  # Deploy to GitHub Pages (main branch only)
  #
  # main is the showcase branch -- the README links the live demo, so the
  # deployed site must match the code a visitor is reading. develop can run
  # ahead without flipping the public demo back and forth.
  # =============================================================================

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.70.2
          cache: true

      - name: Download emscripten Release artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-emscripten-Release
          path: _package/emscripten/

      - name: Publish site
        run: pixi run publish --platform emscripten --build-type Release

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
