name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  # =============================================================================
  # Formatting Check
  # =============================================================================

  check-formatting:
    name: Check formatting
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: .\tools\framework\bootstrap.ps1

      - name: Check code formatting
        run: .\repo.cmd format --verify

  # =============================================================================
  # Build (platform × build_type matrix)
  # =============================================================================

  # Windows build runs first — it generates USDZ scenes that the
  # Emscripten build needs for --embed-file.
  build-windows:
    name: Build (windows-x64, Release)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: .\tools\framework\bootstrap.ps1

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            tools/framework/_managed/venv
            tools/framework/_managed/cache
          key: windows-latest-python-${{ hashFiles('tools/framework/pyproject.toml') }}
          restore-keys: |
            windows-latest-python-

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: windows-x64-conan-${{ hashFiles('conanfile.py', 'conan_glfw.lock') }}
          restore-keys: |
            windows-x64-conan-${{ hashFiles('conanfile.py') }}

      - name: Build project
        run: .\repo.cmd build --platform windows-x64 --build-type Release

      - name: Package build artifacts
        run: .\repo.cmd package --platform windows-x64 --build-type Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-x64-Release
          path: _package/windows-x64/
          if-no-files-found: error
          retention-days: 3

      # USDZ scenes are generated by the prebuild step. Upload them
      # separately so the Emscripten build can embed them in WASM.
      - name: Upload USDZ scenes
        uses: actions/upload-artifact@v4
        with:
          name: usdz-scenes
          path: assets/scenes/*.usdz
          if-no-files-found: error
          retention-days: 3

  build-emscripten:
    name: Build (emscripten, Release)
    runs-on: ubuntu-latest
    needs: build-windows
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: bash tools/framework/bootstrap.sh

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            tools/framework/_managed/venv
            tools/framework/_managed/cache
          key: ubuntu-latest-python-${{ hashFiles('tools/framework/pyproject.toml') }}
          restore-keys: |
            ubuntu-latest-python-

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: emscripten-conan-${{ hashFiles('conanfile.py', 'conan_emscripten.lock') }}
          restore-keys: |
            emscripten-conan-${{ hashFiles('conanfile.py') }}

      - name: Download USDZ scenes
        uses: actions/download-artifact@v4
        with:
          name: usdz-scenes
          path: assets/scenes/

      - name: Build project
        run: ./repo build --platform emscripten --build-type Release

      - name: Package build artifacts
        run: ./repo package --platform emscripten --build-type Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-emscripten-Release
          path: _package/emscripten/
          if-no-files-found: error
          retention-days: 3

  # =============================================================================
  # Test (platform × build_type matrix)
  # =============================================================================

  test:
    name: Test (${{ matrix.platform }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    needs: [build-windows, build-emscripten]
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, emscripten]
        build_type: [Release]
        include:
          - platform: windows-x64
            os: windows-latest
            shell: pwsh
            bootstrap: .\tools\framework\bootstrap.ps1
            repo: .\repo.cmd
          - platform: emscripten
            os: ubuntu-latest
            shell: bash
            bootstrap: bash tools/framework/bootstrap.sh
            repo: ./repo

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: ${{ matrix.bootstrap }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.build_type }}
          path: _package/${{ matrix.platform }}/

      - name: Run tests
        run: ${{ matrix.repo }} test --platform ${{ matrix.platform }} --build-type ${{ matrix.build_type }} --from-package

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.build_type }}
          path: _logs/
          retention-days: 3

  # =============================================================================
  # Deploy to GitHub Pages (develop branch only)
  # =============================================================================

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build-windows, build-emscripten, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: bash tools/framework/bootstrap.sh

      - name: Download emscripten Release artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-emscripten-Release
          path: _package/emscripten/

      - name: Publish site
        run: ./repo publish --platform emscripten --build-type Release

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
