name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  # =============================================================================
  # Formatting Check
  # =============================================================================

  check-formatting:
    name: Check formatting
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: .\tools\framework\bootstrap.ps1

      - name: Check code formatting
        run: .\repo.cmd format --verify

  # =============================================================================
  # Build (platform × build_type matrix)
  # =============================================================================

  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, emscripten]
        build_type: [Debug, Release]
        include:
          - platform: windows-x64
            os: windows-latest
            shell: pwsh
            bootstrap: .\tools\framework\bootstrap.ps1
            repo: .\repo.cmd
          - platform: emscripten
            os: ubuntu-latest
            shell: bash
            bootstrap: bash tools/framework/bootstrap.sh
            repo: ./repo

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: ${{ matrix.bootstrap }}

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            _tools/venv
            _tools/cache
          key: ${{ matrix.os }}-python-${{ hashFiles('tools/pyproject.toml') }}
          restore-keys: |
            ${{ matrix.os }}-python-

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ matrix.platform }}-conan-${{ hashFiles('conanfile.py', 'conan_*.lock') }}-${{ matrix.build_type }}
          restore-keys: |
            ${{ matrix.platform }}-conan-${{ hashFiles('conanfile.py') }}-${{ matrix.build_type }}
            ${{ matrix.platform }}-conan-

      - name: Build project
        run: ${{ matrix.repo }} build --platform ${{ matrix.platform }} --build-type ${{ matrix.build_type }}

      - name: Package build artifacts
        run: ${{ matrix.repo }} package --platform ${{ matrix.platform }} --build-type ${{ matrix.build_type }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.build_type }}
          path: _package/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 3

  # =============================================================================
  # Test (platform × build_type matrix)
  # =============================================================================

  test:
    name: Test (${{ matrix.platform }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, emscripten]
        build_type: [Debug, Release]
        include:
          - platform: windows-x64
            os: windows-latest
            shell: pwsh
            bootstrap: .\tools\framework\bootstrap.ps1
            repo: .\repo.cmd
          - platform: emscripten
            os: ubuntu-latest
            shell: bash
            bootstrap: bash tools/framework/bootstrap.sh
            repo: ./repo

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: ${{ matrix.bootstrap }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.build_type }}
          path: _build/${{ matrix.platform }}/

      - name: Run tests
        run: ${{ matrix.repo }} test --platform ${{ matrix.platform }} --build-type ${{ matrix.build_type }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.build_type }}
          path: _logs/
          retention-days: 3
