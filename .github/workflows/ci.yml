name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  # =============================================================================
  # Formatting Check
  # =============================================================================

  check-formatting:
    name: Check formatting
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: .\tools\framework\bootstrap.ps1

      - name: Check code formatting
        run: .\repo.cmd format --verify

  # =============================================================================
  # Build (platform × build_type matrix)
  # =============================================================================

  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Windows must finish before Emscripten starts (USDZ scene dependency).
      # max-parallel: 1 ensures sequential execution in platform order.
      max-parallel: 1
      matrix:
        platform: [windows-x64, emscripten]
        build_type: [Release]
        include:
          - platform: windows-x64
            os: windows-latest
            shell: pwsh
            bootstrap: .\tools\framework\bootstrap.ps1
            repo: .\repo.cmd
            lock_file: conan_glfw.lock
          - platform: emscripten
            os: ubuntu-latest
            shell: bash
            bootstrap: bash tools/framework/bootstrap.sh
            repo: ./repo
            lock_file: conan_emscripten.lock

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: ${{ matrix.bootstrap }}

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            tools/framework/_managed/venv
            tools/framework/_managed/cache
          key: ${{ matrix.os }}-python-${{ hashFiles('tools/framework/pyproject.toml') }}
          restore-keys: |
            ${{ matrix.os }}-python-

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ matrix.platform }}-conan-${{ hashFiles('conanfile.py', matrix.lock_file) }}
          restore-keys: |
            ${{ matrix.platform }}-conan-${{ hashFiles('conanfile.py') }}

      # Windows prebuild generates USDZ scenes; upload them so the
      # Emscripten build can embed them in WASM via --embed-file.
      # usdz_pack is a native host tool that cannot cross-compile to WASM.
      - name: Download USDZ scenes
        if: matrix.platform == 'emscripten'
        uses: actions/download-artifact@v4
        with:
          name: usdz-scenes
          path: assets/scenes/

      - name: Build project
        run: ${{ matrix.repo }} build --platform ${{ matrix.platform }} --build-type ${{ matrix.build_type }}
        env:
          PTSTUDIO_GPU_BACKEND: ${{ matrix.platform == 'windows-x64' && 'D3D12' || '' }}

      - name: Upload USDZ scenes
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: usdz-scenes
          path: assets/scenes/*.usdz
          if-no-files-found: error
          retention-days: 3

      - name: Package build artifacts
        run: ${{ matrix.repo }} package --platform ${{ matrix.platform }} --build-type ${{ matrix.build_type }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.build_type }}
          path: _package/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 3

  # =============================================================================
  # Test (platform × build_type matrix)
  # =============================================================================

  test:
    name: Test (${{ matrix.platform }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, emscripten]
        build_type: [Release]
        include:
          - platform: windows-x64
            os: windows-latest
            shell: pwsh
            bootstrap: .\tools\framework\bootstrap.ps1
            repo: .\repo.cmd
          - platform: emscripten
            os: ubuntu-latest
            shell: bash
            bootstrap: bash tools/framework/bootstrap.sh
            repo: ./repo

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: ${{ matrix.bootstrap }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.build_type }}
          path: _package/${{ matrix.platform }}/

      - name: Run tests
        run: ${{ matrix.repo }} test --platform ${{ matrix.platform }} --build-type ${{ matrix.build_type }} --from-package
        env:
          PTSTUDIO_GPU_BACKEND: ${{ matrix.platform == 'windows-x64' && 'D3D12' || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.build_type }}
          path: _logs/
          retention-days: 3

  # =============================================================================
  # Deploy to GitHub Pages (develop branch only)
  # =============================================================================

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: bash tools/framework/bootstrap.sh

      - name: Download emscripten Release artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-emscripten-Release
          path: _package/emscripten/

      - name: Publish site
        run: ./repo publish --platform emscripten --build-type Release

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
