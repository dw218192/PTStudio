name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  # =============================================================================
  # Formatting Check
  # =============================================================================

  check-formatting:
    name: Check formatting
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: .\tools\framework\bootstrap.ps1

      - name: Check code formatting
        run: .\repo.cmd format --verify

  # =============================================================================
  # Build (platform × build_type matrix)
  # =============================================================================

  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, emscripten]
        build_type: [Debug, Release]

    # Emscripten's port system uses os.path.relpath() which fails across
    # Windows drive letters.  Keep Conan on the workspace drive for all
    # builds so emsdk and the project are always on the same mount.
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          # Remove large pre-installed tools to avoid running out of space
          # when building OpenUSD or emsdk from source.
          $dirs = @(
            "C:\Program Files\dotnet\sdk",
            "C:\Program Files\dotnet\shared",
            "C:\Program Files (x86)\Microsoft SDKs\Azure",
            "C:\Program Files\Microsoft SQL Server",
            "C:\Android",
            "$env:LOCALAPPDATA\Microsoft\AndroidStudio"
          )
          foreach ($d in $dirs) {
            if (Test-Path $d) {
              Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue
              Write-Host "Removed $d"
            }
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: .\tools\framework\bootstrap.ps1

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            _tools/venv
            _tools/cache
          key: windows-python-${{ hashFiles('tools/pyproject.toml') }}
          restore-keys: |
            windows-python-

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.conan2
          key: ${{ matrix.platform }}-conan-${{ hashFiles('conanfile.py', 'conan_*.lock') }}-${{ matrix.build_type }}
          restore-keys: |
            ${{ matrix.platform }}-conan-${{ hashFiles('conanfile.py') }}-${{ matrix.build_type }}
            ${{ matrix.platform }}-conan-

      - name: Build project
        run: .\repo.cmd build --platform ${{ matrix.platform }} --build-type ${{ matrix.build_type }}

      - name: Package build artifacts
        run: .\repo.cmd package --platform ${{ matrix.platform }} --build-type ${{ matrix.build_type }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.build_type }}
          path: _package/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 3

  # =============================================================================
  # Test (platform × build_type matrix)
  # =============================================================================

  test:
    name: Test (${{ matrix.platform }}, ${{ matrix.build_type }})
    runs-on: windows-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, emscripten]
        build_type: [Debug, Release]

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: .\tools\framework\bootstrap.ps1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.build_type }}
          path: _build/${{ matrix.platform }}/

      - name: Run tests
        run: .\repo.cmd test --platform ${{ matrix.platform }} --build-type ${{ matrix.build_type }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.build_type }}
          path: _logs/
          retention-days: 3
