name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  # =============================================================================
  # Formatting Check
  # =============================================================================

  check-formatting:
    name: Check formatting
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: .\tools\bootstrap.ps1

      - name: Check code formatting
        run: .\pts.cmd format --verify

  # =============================================================================
  # Build (platform × build_type matrix)
  # =============================================================================

  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, emscripten]
        build_type: [Debug, Release]
        include:
          - platform: windows-x64
            lock_file: conan_glfw.lock
            build_prefix: _build
          - platform: emscripten
            lock_file: conan_emscripten.lock
            build_prefix: _build/emscripten

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: .\tools\bootstrap.ps1

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            _tools/venv
            _tools/cache
          key: windows-python-${{ hashFiles('tools/requirements.txt') }}
          restore-keys: |
            windows-python-

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ matrix.platform }}-conan-${{ hashFiles('conanfile.py', matrix.lock_file) }}-${{ matrix.build_type }}
          restore-keys: |
            ${{ matrix.platform }}-conan-${{ hashFiles('conanfile.py') }}-${{ matrix.build_type }}
            ${{ matrix.platform }}-conan-

      - name: Build project
        run: .\pts.cmd build --platform ${{ matrix.platform }} --build-type ${{ matrix.build_type }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.build_type }}
          path: |
            ${{ matrix.build_prefix }}/${{ matrix.build_type }}/bin/
            ${{ matrix.build_prefix }}/deps/
            !${{ matrix.build_prefix }}/deps/full_deploy/
          retention-days: 3

  # =============================================================================
  # Test (platform × build_type matrix)
  # =============================================================================

  test:
    name: Test (${{ matrix.platform }}, ${{ matrix.build_type }})
    runs-on: windows-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, emscripten]
        build_type: [Debug, Release]
        include:
          - platform: windows-x64
            lock_file: conan_glfw.lock
            build_prefix: _build
          - platform: emscripten
            lock_file: conan_emscripten.lock
            build_prefix: _build/emscripten

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap build environment
        run: .\tools\bootstrap.ps1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.build_type }}
          path: ${{ matrix.build_prefix }}/

      - name: Run tests
        run: .\pts.cmd launch --test --platform ${{ matrix.platform }} --build-type ${{ matrix.build_type }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.build_type }}
          path: _logs/
          retention-days: 3
